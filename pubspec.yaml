name: smooth_sheets
description: Sheet widgets with smooth motion and great flexibility. Also supports nested navigation in both imperative and declarative ways.
version: 1.2.2
repository: https://github.com/fujidaiti/smooth_sheets
screenshots:
  - description: Practical examples of smooth_sheets.
    path: art/smooth-sheets-thumbnail.png
topics:
  - ui
  - widget
  - bottom-sheet
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"
dependencies:
  collection: ^1.17.1
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  meta: ^1.9.1
  navigator_resizable: ^3.1.0
# Dependencies for testing
dev_dependencies:
  # auto_route 11.2.0 uses ScrollCacheExtent, which is unavailable in Flutter 3.41.0,
  # while still declaring flutter: ">=3.16.0".
  auto_route: ">=11.1.0 <11.2.0"
  build_runner: ^2.4.9
  cupertino_ui: ^1.0.0
  flutter_test:
    sdk: flutter
  go_router: ">=16.2.1 <19.0.0"
  mockito: ^5.4.4
  pedantic_mono: ^1.23.0
